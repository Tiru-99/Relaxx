<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumen Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</head>
<body>
<div id="start">
  <h1>Lumen Isle</h1>
  <p>a quiet place to wander</p>
  <button id="begin" disabled>gathering the island…</button>
  <small>headphones recommended</small>
</div>

<div id="hud"></div>
<div id="hints">
  <span class="keys"><kbd>W A S D</kbd>wander</span><span class="keys"><kbd>shift</kbd>drift</span>
  <span class="touch-only">left side · move</span><span><kbd>drag</kbd>look</span><span class="keys"><kbd>scroll</kbd>zoom</span><span class="keys"><kbd>space</kbd>hop</span>
  <span class="keys"><kbd>E</kbd>plant a flower</span><span class="keys"><kbd>Q</kbd>listen</span><span class="keys"><kbd>J</kbd>journal</span>
  <span class="keys"><kbd>B</kbd>breathe</span><span class="keys"><kbd>M</kbd>music</span><span class="keys"><kbd>H</kbd>hide controls</span>
  <span class="reminder"><kbd>H</kbd>show controls</span>
</div>
<div id="sky-time" role="group" aria-label="Time of day">
  <button type="button" data-time="dawn">dawn</button>
  <button type="button" data-time="day">day</button>
  <button type="button" data-time="evening">evening</button>
  <button type="button" data-time="night">night</button>
</div>
<div id="toast"></div>
<div id="breath"><div class="ring"></div><div class="label">breathe in</div></div>

<div id="touch">
  <button type="button" data-action="plant">plant</button>
  <button type="button" data-action="listen">listen</button>
  <button type="button" data-action="journal">journal</button>
</div>

<div id="journal" role="dialog" aria-label="Field journal">
  <div class="page">
    <div>
      <h2>field journal</h2>
      <p data-summary></p>
      <canvas width="300" height="300" aria-label="Map of the places you have walked"></canvas>
    </div>
    <div>
      <h3>places</h3>
      <ul data-places></ul>
      <h3>creatures</h3>
      <ul data-creatures></ul>
      <div class="actions">
        <button type="button" data-reset>begin again</button>
        <button type="button" data-close>close · J</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
