<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumen Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #fdf6ec; --soft: rgba(253,246,236,0.7); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f3a; font-family: 'Quicksand', system-ui, sans-serif; color: var(--ink); user-select: none; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #3b3f7a 0%, #1b1f3a 70%); z-index: 20; transition: opacity 2.5s ease;
  }
  #start h1 { font-weight: 500; font-size: clamp(42px, 8vw, 84px); letter-spacing: 0.08em; margin: 0; text-shadow: 0 0 40px rgba(255,220,170,0.45); }
  #start p { color: var(--soft); margin: 10px 0 40px; letter-spacing: 0.15em; font-size: 15px; }
  #start button {
    font-family: inherit; font-size: 17px; letter-spacing: 0.2em; color: var(--ink); background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.3); padding: 14px 44px; border-radius: 40px; cursor: pointer; transition: all .6s ease;
  }
  #start button:hover { background: rgba(255,255,255,0.16); box-shadow: 0 0 40px rgba(255,220,170,0.35); }
  #start small { position: absolute; bottom: 28px; color: rgba(255,255,255,0.45); letter-spacing: 0.1em; }

  #hud { position: fixed; top: 22px; left: 26px; font-size: 15px; letter-spacing: 0.08em; color: var(--soft); z-index: 5; text-shadow: 0 1px 8px rgba(0,0,0,0.35); opacity: 0; transition: opacity 3s; }
  #hud b { color: var(--ink); font-weight: 600; }
  #hints { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 13px; letter-spacing: 0.08em; color: var(--soft);
    text-align: center; z-index: 5; text-shadow: 0 1px 8px rgba(0,0,0,0.4); transition: opacity 2s; opacity: 0; line-height: 1.9; width: calc(100% - 32px); }
  #hints span { white-space: nowrap; margin: 0 9px; }
  #hints kbd { font-family: inherit; border: 1px solid rgba(255,255,255,0.35); border-radius: 6px; padding: 1px 7px; margin-right: 4px; font-size: 12px; }
  #toast { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 20px; letter-spacing: 0.08em; text-align: center;
    color: var(--ink); text-shadow: 0 0 24px rgba(0,0,0,0.5); opacity: 0; transition: opacity 1.5s; pointer-events: none; z-index: 6; width: calc(100% - 32px); }

  #breath { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 8; opacity: 0; transition: opacity 1.5s; }
  #breath .ring { width: 260px; height: 260px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.55);
    background: radial-gradient(circle, rgba(255,230,200,0.18), rgba(255,230,200,0.02) 70%); box-shadow: 0 0 60px rgba(255,220,180,0.25);
    display: flex; align-items: center; justify-content: center; transform: scale(0.55); }
  #breath .label { position: absolute; font-size: 20px; letter-spacing: 0.25em; text-transform: lowercase; }
</style>
</head>
<body>
<div id="start">
  <h1>Lumen Isle</h1>
  <p>a quiet place to wander</p>
  <button id="begin">BEGIN</button>
  <small>headphones recommended</small>
</div>
<div id="hud"></div>
<div id="hints">
  <span><kbd>W A S D</kbd>wander</span><span><kbd>drag</kbd>look</span><span><kbd>scroll</kbd>zoom</span>
  <span><kbd>space</kbd>hop</span><span><kbd>E</kbd>plant a flower</span><span><kbd>B</kbd>breathe</span>
  <span><kbd>M</kbd>music</span><span><kbd>H</kbd>hide hints</span>
</div>
<div id="toast"></div>
<div id="breath"><div class="ring"></div><div class="label">breathe in</div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* =====================================================================
   AUDIO — everything is synthesized live with the Web Audio API
   ===================================================================== */
let AC, master, musicGain, sfxGain, reverb, noiseBuf, waterGain, musicOn = true;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const PENTA = [0, 2, 4, 7, 9];            // D major pentatonic
const penta = (i, base = 62) => base + PENTA[((i % 5) + 5) % 5] + 12 * Math.floor(i / 5);

function makeImpulse(sec, decay) {
  const len = AC.sampleRate * sec, b = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return b;
}

function initAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.85;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
  master.connect(comp); comp.connect(AC.destination);

  reverb = AC.createConvolver(); reverb.buffer = makeImpulse(6, 2.8);
  const wet = AC.createGain(); wet.gain.value = 0.7; reverb.connect(wet); wet.connect(master);

  musicGain = AC.createGain(); musicGain.gain.value = 0;
  musicGain.gain.setTargetAtTime(0.5, AC.currentTime, 3);
  musicGain.connect(master);
  const mSend = AC.createGain(); mSend.gain.value = 0.9; musicGain.connect(mSend); mSend.connect(reverb);

  sfxGain = AC.createGain(); sfxGain.gain.value = 0.7; sfxGain.connect(master);
  const sSend = AC.createGain(); sSend.gain.value = 0.45; sfxGain.connect(sSend); sSend.connect(reverb);

  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  startWater();
  scheduleChord();
  setTimeout(melodyTick, 4000);
}

// --- ambient ocean: brown noise, slowly breathing in and out
function startWater() {
  const len = AC.sampleRate * 6, b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  const src = AC.createBufferSource(); src.buffer = b; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650;
  waterGain = AC.createGain(); waterGain.gain.value = 0.08;
  const swell = AC.createGain(); swell.gain.value = 0.7;
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.09;
  const lfoAmt = AC.createGain(); lfoAmt.gain.value = 0.3;
  lfo.connect(lfoAmt); lfoAmt.connect(swell.gain); lfo.start();
  src.connect(lp); lp.connect(swell); swell.connect(waterGain); waterGain.connect(master);
  src.start();
}

// --- warm pad chords, slowly overlapping
const CHORDS = [
  [50, 57, 61, 64, 66],   // Dmaj9
  [47, 54, 57, 62, 66],   // Bm9
  [43, 50, 54, 59, 62],   // Gmaj7
  [45, 52, 57, 59, 64],   // Asus/add9
];
let chordIdx = 0;
function padNote(midi, start, dur, vol) {
  const f = mtof(midi);
  const g = AC.createGain(); g.gain.setValueAtTime(0, start);
  g.gain.setTargetAtTime(vol, start, 1.4);
  g.gain.setTargetAtTime(0, start + dur, 1.8);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 0.3;
  lp.connect(g); g.connect(musicGain);
  const oscs = [['sine', 0, 1], ['triangle', 6, 0.5], ['sine', -7, 0.8]];
  for (const [type, det, amp] of oscs) {
    const o = AC.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = det;
    const og = AC.createGain(); og.gain.value = amp;
    o.connect(og); og.connect(lp); o.start(start); o.stop(start + dur + 10);
  }
}
function scheduleChord() {
  const now = AC.currentTime + 0.05, dur = 10;
  const chord = CHORDS[chordIdx++ % CHORDS.length];
  chord.forEach(n => padNote(n, now, dur, 0.028));
  padNote(chord[0] - 12, now, dur, 0.05); // soft bass
  setTimeout(scheduleChord, dur * 1000);
}

// --- gentle kalimba-like bell
function bell(midi, vol = 0.08, dest = sfxGain, when = AC.currentTime, decay = 3.2) {
  const f = mtof(midi);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(vol, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + decay);
  const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f;
  o.connect(g); g.connect(dest); o.start(when); o.stop(when + decay + 0.1);
  const g2 = AC.createGain(); g2.gain.setValueAtTime(vol * 0.25, when);
  g2.gain.exponentialRampToValueAtTime(0.0001, when + decay * 0.3);
  const o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 3.01;
  o2.connect(g2); g2.connect(dest); o2.start(when); o2.stop(when + decay);
}
function melodyTick() {
  if (Math.random() < 0.65) {
    const i = 5 + Math.floor(Math.random() * 8);
    bell(penta(i), 0.045, musicGain, AC.currentTime, 4.5);
    if (Math.random() < 0.3) bell(penta(i + 2), 0.03, musicGain, AC.currentTime + 0.45, 4);
  }
  setTimeout(melodyTick, 1800 + Math.random() * 3600);
}

// --- movement sounds
function noiseHit({ freq = 700, q = 1.2, vol = 0.08, dur = 0.12, type = 'bandpass' }) {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(sfxGain);
  src.start(t, Math.random() * 1.5, dur + 0.05);
}
const sfx = {
  step(onSand) { noiseHit({ freq: (onSand ? 1500 : 650) + Math.random() * 300, q: onSand ? 0.8 : 1.4, vol: onSand ? 0.05 : 0.07, dur: onSand ? 0.16 : 0.1 }); },
  hop() {
    if (!AC) return;
    const t = AC.currentTime, src = AC.createBufferSource(); src.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(1400, t + 0.35);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    src.connect(f); f.connect(g); g.connect(sfxGain); src.start(t, 0, 0.5);
  },
  land() { noiseHit({ freq: 260, q: 0.7, vol: 0.09, dur: 0.18, type: 'lowpass' }); },
  plant() { if (AC) bell(penta(10 + Math.floor(Math.random() * 5)), 0.05, sfxGain, AC.currentTime, 1.6); },
};
let moteNote = 0;
function moteChime() { if (!AC) return; bell(penta(5 + (moteNote++ % 10)), 0.09); }
function lanternChord() {
  if (!AC) return;
  const base = Math.floor(Math.random() * 3);
  [0, 2, 4, 7].forEach((s, k) => bell(penta(base + s + 3), 0.08, sfxGain, AC.currentTime + k * 0.18, 4));
}
function stoneNote(i) { if (AC) bell(penta(i, 50), 0.12, sfxGain, AC.currentTime, 5); }
function finaleArp() {
  if (!AC) return;
  for (let k = 0; k < 14; k++) bell(penta(3 + k), 0.06, sfxGain, AC.currentTime + k * 0.22, 5);
}
function setWaterLevel(v) { if (waterGain) waterGain.gain.setTargetAtTime(v, AC.currentTime, 0.8); }
function toggleMusic() {
  musicOn = !musicOn;
  if (musicGain) musicGain.gain.setTargetAtTime(musicOn ? 0.5 : 0, AC.currentTime, 1.2);
  toast(musicOn ? 'music on' : 'music off');
}

/* =====================================================================
   WORLD
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 55, 230);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1200);

const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);

function height(x, z) {
  const r = Math.hypot(x, z);
  const n = Math.sin(x * 0.13 + 0.5) * Math.cos(z * 0.11) * 1.3
          + Math.sin(x * 0.045 + z * 0.06) * 1.6
          + Math.sin(x * 0.29 + 1.3) * Math.sin(z * 0.25 + 0.7) * 0.45;
  const edge = 1 - smoothstep(24, 44, r + n * 2.2);
  return -1.8 + edge * (5 + n * 0.9) + Math.pow(Math.max(0, 1 - r / 16), 2) * 3.5;
}

// glow texture used for every soft light
const GLOW = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.75)');
  gr.addColorStop(0.45, 'rgba(255,255,255,0.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const glowMat = (color, opacity = 1) => new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });

// ---------- sky
const skyUniforms = { top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 bottom; varying vec3 vP;
    void main(){ float h = normalize(vP).y; gl_FragColor = vec4(mix(bottom, top, pow(max(h,0.0),0.55)), 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }`,
}));
scene.add(sky);

const starGeo = new THREE.BufferGeometry(), sp = [];
for (let i = 0; i < 1600; i++) {
  const u = Math.random() * Math.PI * 2, v = Math.acos(rand(0.05, 1)), R = 550;
  sp.push(R * Math.sin(v) * Math.cos(u), R * Math.cos(v), R * Math.sin(v) * Math.sin(u));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
scene.add(new THREE.Points(starGeo, starMat));

// ---------- lights
const hemi = new THREE.HemisphereLight(0xffffff, 0x4a5a3a, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, near: 1, far: 220 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// ---------- terrain
const tg = new THREE.PlaneGeometry(150, 150, 170, 170); tg.rotateX(-Math.PI / 2);
const tp = tg.attributes.position, tcol = [];
const C = { deep: new THREE.Color(0xc9b484), sand: new THREE.Color(0xf0dcae), grass: new THREE.Color(0x93c97c), grass2: new THREE.Color(0x6eab6b), hill: new THREE.Color(0xb3cf8a) };
const tmpC = new THREE.Color();
for (let i = 0; i < tp.count; i++) {
  const x = tp.getX(i), z = tp.getZ(i), y = height(x, z);
  tp.setY(i, y);
  if (y < -0.2) tmpC.copy(C.deep);
  else if (y < 0.55) tmpC.copy(C.sand);
  else if (y < 1.1) tmpC.copy(C.sand).lerp(C.grass, (y - 0.55) / 0.55);
  else if (y < 5) tmpC.copy(C.grass).lerp(C.grass2, (y - 1.1) / 3.9 + Math.sin(x * 0.3) * 0.15);
  else tmpC.copy(C.grass2).lerp(C.hill, Math.min(1, (y - 5) / 3));
  tmpC.offsetHSL(0, 0, (Math.random() - 0.5) * 0.03);
  tcol.push(tmpC.r, tmpC.g, tmpC.b);
}
tg.setAttribute('color', new THREE.Float32BufferAttribute(tcol, 3));
const terrain = new THREE.Mesh(tg.toNonIndexed(), new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
terrain.receiveShadow = true;
scene.add(terrain);

// ---------- water
const wg = new THREE.PlaneGeometry(700, 700, 110, 110); wg.rotateX(-Math.PI / 2);
const wBase = Float32Array.from(wg.attributes.position.array);
const waterMat = new THREE.MeshStandardMaterial({ color: 0x6fc3d0, transparent: true, opacity: 0.82, roughness: 0.18, metalness: 0.1, flatShading: true });
const water = new THREE.Mesh(wg, waterMat); water.receiveShadow = true;
scene.add(water);

// ---------- lanterns
const lanterns = [];
const postMat = new THREE.MeshStandardMaterial({ color: 0x6b4a35, flatShading: true, roughness: 0.9 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x3e3550, flatShading: true });
for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2 + 0.3;
  let r = 17 + (i % 3) * 5;
  while (height(Math.cos(a) * r, Math.sin(a) * r) < 1.0 && r > 8) r -= 1;
  const x = Math.cos(a) * r, z = Math.sin(a) * r, y = height(x, z);
  const g = new THREE.Group(); g.position.set(x, y, z);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 2.2, 6), postMat); post.position.y = 1.1;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.08), postMat); arm.position.set(0.3, 2.1, 0);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf3e3c3, emissive: 0xffb05a, emissiveIntensity: 0, flatShading: true });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.45, 6), bodyMat); body.position.set(0.6, 1.75, 0);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.25, 6), roofMat); roof.position.set(0.6, 2.08, 0);
  [post, arm, body, roof].forEach(m => { m.castShadow = true; g.add(m); });
  const glow = new THREE.Sprite(glowMat(0xffc27a, 0)); glow.position.set(0.6, 1.75, 0); glow.scale.setScalar(4); g.add(glow);
  const hint = new THREE.Sprite(glowMat(0xbfe3ff, 0.3)); hint.position.set(0.6, 1.75, 0); hint.scale.setScalar(1.2); g.add(hint);
  const light = new THREE.PointLight(0xffb36b, 0, 14, 1.6); light.position.set(0.6, 1.6, 0); g.add(light);
  g.rotation.y = rand(0, Math.PI * 2);
  scene.add(g);
  lanterns.push({ g, x, z, lit: false, litAt: 0, bodyMat, glow, hint, light, warned: false });
}

// ---------- singing stones on the hilltop
const stones = [];
const stoneColors = [0xf6b6c8, 0xf9d39b, 0xbfe6b0, 0xa9d8f0, 0xcdb8f2];
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2 + Math.PI / 2, x = Math.cos(a) * 3.6, z = Math.sin(a) * 3.6;
  const mat = new THREE.MeshStandardMaterial({ color: 0xd8d4e2, emissive: stoneColors[i], emissiveIntensity: 0.05, flatShading: true, roughness: 0.7 });
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5, 0), mat);
  m.scale.set(0.8, 1.9 + i * 0.12, 0.7);
  m.position.set(x, height(x, z) + 0.7, z); m.rotation.y = a; m.castShadow = true;
  scene.add(m);
  const glow = new THREE.Sprite(glowMat(stoneColors[i], 0)); glow.position.copy(m.position); glow.scale.setScalar(4); scene.add(glow);
  stones.push({ m, mat, glow, x, z, cool: 0, pulse: 0, idx: [0, 1, 2, 3, 4][i] });
}

// ---------- trees, rocks, grass
const solids = []; // {x,z,r}
stones.forEach(s => solids.push({ x: s.x, z: s.z, r: 0.55 }));
lanterns.forEach(l => solids.push({ x: l.x, z: l.z, r: 0.3 }));
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a5a44, flatShading: true });
const leafMats = [0x6fae6a, 0x5d9c6b, 0x8cc47a, 0xf2b8c6, 0xf5c98e, 0xb7d77e].map(c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.85 }));
const trunkGeo = new THREE.CylinderGeometry(0.13, 0.2, 1.2, 6); trunkGeo.translate(0, 0.6, 0);
const coneGeos = [0, 1, 2].map(k => new THREE.ConeGeometry(1.15 - k * 0.28, 1.4, 7));
const blobGeo = new THREE.IcosahedronGeometry(1, 0);
const trees = [], camBlockers = [];
function farFromThings(x, z, d) {
  if (Math.hypot(x, z) < 6.5) return false;
  if (Math.hypot(x, z - 9) < 3) return false;

const K = (p, top, bot, light, li, hemi, night, water) => ({ p, top: new THREE.Color(top), bot: new THREE.Color(bot), light: new THREE.Color(light), li, hemi, night, water: new THREE.Color(water) });
const NIGHT = [0x0e1338, 0x3b3672, 0x8a98d8, 0.45, 0.5, 1, 0x26426e];
const DAWN = [0x6d82c4, 0xf7bcae, 0xffc8a2, 1.3, 0.75, 0.25, 0x8fb0c8];
const DAY = [0x7ec4ec, 0xdcf0f6, 0xfff4e0, 2.2, 1.0, 0, 0x6fc3d0];
const DUSK = [0x4d4b8e, 0xf8a986, 0xffa274, 1.2, 0.7, 0.35, 0x7d8fb5];
const KEYS = [K(0, ...NIGHT), K(0.12, ...NIGHT), K(0.25, ...DAWN), K(0.38, ...DAY), K(0.6, ...DAY), K(0.74, ...DUSK), K(0.87, ...NIGHT), K(1, ...NIGHT)];
const CYCLE = 420; // seconds per full day
let dayP = 0.66, nightF = 0;
function applyCycle() {
  let k = 0; while (KEYS[k + 1].p <= dayP) k++;
  const a = KEYS[k], b = KEYS[k + 1];
  let f = (dayP - a.p) / (b.p - a.p); f = f * f * (3 - 2 * f);
  skyUniforms.top.value.copy(a.top).lerp(b.top, f);
  skyUniforms.bottom.value.copy(a.bot).lerp(b.bot, f);
  scene.fog.color.copy(skyUniforms.bottom.value);
  sun.color.copy(a.light).lerp(b.light, f);
  sun.intensity = a.li + (b.li - a.li) * f;
  hemi.intensity = a.hemi + (b.hemi - a.hemi) * f;
  hemi.color.copy(skyUniforms.top.value).lerp(new THREE.Color(0xffffff), 0.5);
  nightF = a.night + (b.night - a.night) * f;
  waterMat.color.copy(a.water).lerp(b.water, f);
  starMat.opacity = Math.max(0, nightF - 0.2) * 1.1;
  ffMat.opacity = 0.12 + nightF * 0.85;
  cloudMat.color.copy(skyUniforms.bottom.value).lerp(new THREE.Color(0xffffff), 0.6 - nightF * 0.3);
  const ang = dayP * Math.PI * 2;
  sun.position.set(Math.cos(ang) * 60, 55 + Math.sin(ang) * 15, Math.sin(ang) * 60);
  pLight.intensity = 1 + nightF * 5;
}

let clock = 0, last = performance.now();
const dummy = new THREE.Object3D();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), camRay = new THREE.Raycaster();

function updatePlayer(dt) {
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1;
  if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  const len = Math.hypot(ix, iz) || 1;
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  const SPEED = 5.2;
  const tvx = ((fx * iz + rx * ix) / len) * SPEED, tvz = ((fz * iz + rz * ix) / len) * SPEED;
  const acc = 1 - Math.exp(-dt * 6);
  P.vx += (tvx - P.vx) * acc; P.vz += (tvz - P.vz) * acc;

  // move with soft shoreline + solid collisions
  let nx = P.x + P.vx * dt, nz = P.z + P.vz * dt;
  if (height(nx, P.z) < 0.35) { nx = P.x; P.vx *= 0.5; }
  if (height(nx, nz) < 0.35) { nz = P.z; P.vz *= 0.5; }
  for (const s of solids) {
    const dx = nx - s.x, dz = nz - s.z, d = Math.hypot(dx, dz), min = s.r + 0.4;
    if (d < min && d > 0.0001) { nx = s.x + dx / d * min; nz = s.z + dz / d * min; }
  }
  if (height(nx, nz) >= 0.35) { P.x = nx; P.z = nz; }

  const ground = height(P.x, P.z) + 0.55;
  if ((keys.Space) && P.grounded) { P.vy = 6.5; P.grounded = false; sfx.hop(); }
  P.vy -= 16 * dt; P.y += P.vy * dt;
  if (P.y <= ground) {
    if (!P.grounded) { if (P.vy < -3) { sfx.land(); P.squash = 1; for (let i = 0; i < 6; i++) spawnSpark(P.x, ground - 0.4, P.z, 0xffffff, 0.3, 0.6, 0.8); } }
    P.y = ground; P.vy = 0; P.grounded = true;
  } else if (P.y > ground + 0.05) P.grounded = false;

  const speed = Math.hypot(P.vx, P.vz);
  if (speed > 0.3) {
    const target = Math.atan2(P.vx, P.vz);
    let d = target - P.face; d = Math.atan2(Math.sin(d), Math.cos(d));
    P.face += d * (1 - Math.exp(-dt * 10));
  }
  // footsteps
  if (P.grounded && speed > 0.8) {
    P.stepAcc += speed * dt;
    if (P.stepAcc > 1.5) { P.stepAcc = 0; sfx.step(height(P.x, P.z) < 1.05); }
  }
  // trail
  trailTimer -= dt;
  if (speed > 1 && trailTimer <= 0) { trailTimer = 0.06; spawnSpark(P.x + rand(-0.2, 0.2), P.y + rand(-0.2, 0.1), P.z + rand(-0.2, 0.2), 0xd8ecff, 0.35, 0.3, 1.1); }

  P.squash = Math.max(0, P.squash - dt * 4);
  const bob = P.grounded ? Math.sin(clock * 3) * 0.07 + (speed > 1 ? Math.abs(Math.sin(clock * 9)) * 0.08 : 0) : 0;
  player.position.set(P.x, P.y, P.z);
  spirit.position.y = bob;
  spirit.rotation.y = P.face;
  spirit.rotation.z = Math.sin(clock * 1.7) * 0.05;
  const sq = P.squash * 0.25;
  bodyM.scale.set(1 + sq, 1 - sq, 1 + sq);
  auraS.material.opacity = 0.35 + nightF * 0.35 + Math.sin(clock * 2) * 0.05;

  // closer to the shore = louder waves
  setWaterLevel(0.05 + 0.16 * (1 - Math.min(1, Math.max(0, (height(P.x, P.z) - 0.3) / 5))));
}

function updateCamera(dt) {
  const k = 1 - Math.exp(-dt * 5);
  cam.yaw += (cam.tYaw - cam.yaw) * k; cam.pitch += (cam.tPitch - cam.pitch) * k; cam.dist += (cam.tDist - cam.dist) * k;
  const tx = P.x, ty = P.y + 0.9, tz = P.z;
  const dir = new THREE.Vector3(Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), Math.cos(cam.yaw) * Math.cos(cam.pitch));
  // pull the camera in when a tree is between it and the spirit
  camRay.set(new THREE.Vector3(tx, ty, tz), dir); camRay.far = cam.dist;
  const hit = camRay.intersectObjects(camBlockers, false)[0];
  const dist = hit ? Math.max(1.8, hit.distance - 0.4) : cam.dist;
  let cx = tx + dir.x * dist, cy = ty + dir.y * dist, cz = tz + dir.z * dist;
  cy = Math.max(cy, height(cx, cz) + 0.8, 0.9);
  camPos.set(cx, cy, cz);
  camera.position.lerp(camPos, 1 - Math.exp(-dt * 8));
  camLook.lerp(new THREE.Vector3(tx, ty, tz), 1 - Math.exp(-dt * 10));
  camera.lookAt(camLook);
}

function updateWorld(dt) {
  // water
  const wp = water.geometry.attributes.position, arr = wp.array;
  for (let i = 0; i < arr.length; i += 3) {
    const x = wBase[i], z = wBase[i + 2];
    arr[i + 1] = Math.sin(x * 0.09 + clock * 0.7) * 0.14 + Math.cos(z * 0.11 + clock * 0.55) * 0.14 + Math.sin((x + z) * 0.2 + clock * 1.1) * 0.05;
  }
  wp.needsUpdate = true;

  trees.forEach(t => { t.crown.rotation.z = Math.sin(clock * 0.8 + t.phase) * 0.035; t.crown.rotation.x = Math.cos(clock * 0.6 + t.phase) * 0.025; });
  clouds.forEach(c => { c.a += c.sp * dt; c.g.position.set(Math.cos(c.a) * c.r, c.y + Math.sin(clock * 0.2 + c.r) * 0.6, Math.sin(c.a) * c.r); c.g.rotation.y = -c.a; });

  for (let i = 0; i < FF; i++) {
    const f = ffBase[i], t = clock * f.s + f.p;
    ffPos[i * 3] = f.x + Math.sin(t) * 1.5; ffPos[i * 3 + 1] = f.y + Math.sin(t * 1.3) * 0.6; ffPos[i * 3 + 2] = f.z + Math.cos(t * 0.9) * 1.5;
  }
  ffGeo.attributes.position.needsUpdate = true;

  // sparks
  for (const t of trail) {
    if (t.life <= 0) { t.s.material.opacity = 0; continue; }
    t.life -= dt; const f = Math.max(0, t.life / t.max);
    t.s.position.x += t.vx * dt; t.s.position.y += t.vy * dt; t.s.position.z += t.vz * dt;
    t.s.material.opacity = f * 0.8; t.s.scale.setScalar(t.size * (0.4 + f));
  }

  // motes
  for (const m of motes) {
    if (!m.active) {
      m.respawn -= dt;
      if (m.respawn <= 0) { placeMote(m); m.active = true; m.g.visible = true; }
      continue;
    }
    const y = m.baseY + Math.sin(clock * 1.5 + m.p) * 0.25;
    m.g.position.set(m.x, y, m.z);
    m.core.rotation.y += dt * 1.5; m.core.rotation.x += dt * 0.7;
    m.halo.material.opacity = 0.65 + Math.sin(clock * 3 + m.p) * 0.25;
    if (Math.hypot(m.x - P.x, m.z - P.z) < 1.3 && Math.abs(y - P.y) < 1.8) {
      m.active = false; m.g.visible = false; m.respawn = rand(6, 14);
      motesHeld++; moteChime(); updateHud();
      for (let i = 0; i < 10; i++) spawnSpark(m.x, y, m.z, 0xaee4ff, 0.5, rand(0.5, 1.5), 1.4);
    }
  }

  // lanterns
  for (const l of lanterns) {
    const d = Math.hypot(l.x - P.x, l.z - P.z);
    if (!l.lit) {
      l.hint.material.opacity = 0.18 + Math.sin(clock * 1.6 + l.x) * 0.12;
      if (d < 2.4) {
        if (motesHeld >= 3) {
          motesHeld -= 3; l.lit = true; l.litAt = clock; litCount++; updateHud(); lanternChord();
          l.hint.visible = false;
          for (let i = 0; i < 16; i++) { const a = rand(0, 6.28), r = rand(1.3, 4.2); addFlower(l.x + Math.cos(a) * r, l.z + Math.sin(a) * r, rand(0.2, 2.5)); }
          if (litCount === 7) { finale = true; setTimeout(() => { finaleArp(); releaseSkyLanterns(); toast('the whole island glows. stay as long as you like.', 8); }, 1500); }
          else toast(['a warm light returns', 'the flowers wake up', 'softly, softly', 'the island remembers', 'one more glow', 'almost whole'][litCount - 1] + `  ·  ${litCount}/7`);
        } else if (!l.warned) { l.warned = true; toast(`this lantern needs 3 motes of light  ·  you have ${motesHeld}`); }
      } else if (d > 4) l.warned = false;
    } else {
      const f = Math.min(1, (clock - l.litAt) / 2.5), flick = 1 + Math.sin(clock * 7 + l.x) * 0.04 + Math.sin(clock * 13 + l.z) * 0.03;
      const lvl = f * (0.55 + nightF * 0.6) * flick;
      l.bodyMat.emissiveIntensity = 1.6 * f * flick;
      l.glow.material.opacity = lvl * 0.9;
      l.light.intensity = lvl * 22;
    }
  }

  // singing stones
  for (const s of stones) {
    s.cool -= dt; s.pulse = Math.max(0, s.pulse - dt * 0.6);
    if (Math.hypot(s.x - P.x, s.z - P.z) < 1.25 && s.cool <= 0) {
      s.cool = 1.2; s.pulse = 1; stoneNote(s.idx);
      for (let i = 0; i < 8; i++) spawnSpark(s.x, s.m.position.y + rand(0, 1), s.z, stoneColors[s.idx], 0.5, 1.2, 1.6);
    }
    s.mat.emissiveIntensity = 0.08 + s.pulse * 1.4 + nightF * 0.15;
    s.glow.material.opacity = s.pulse * 0.8;
  }

  // flowers
  for (let i = 0; i < headsIM.count; i++) {
    const f = flowers[i]; if (!f) continue;
    let g = Math.min(1, Math.max(0, (clock - f.born) / 1.1));
    g = g <= 0 ? 0 : 1 + 2.2 * Math.pow(g - 1, 3) + 1.2 * Math.pow(g - 1, 2); // gentle overshoot
    dummy.position.set(f.x, f.y - 0.05, f.z);
    dummy.rotation.set(Math.sin(clock * 1.4 + f.p) * 0.09, f.rot, Math.cos(clock * 1.1 + f.p) * 0.09);
    dummy.scale.setScalar(Math.max(0.0001, f.s * g));
    dummy.updateMatrix(); stemsIM.setMatrixAt(i, dummy.matrix); headsIM.setMatrixAt(i, dummy.matrix);
  }
  stemsIM.instanceMatrix.needsUpdate = headsIM.instanceMatrix.needsUpdate = true;

  // sky lanterns
  for (const s of skyLanterns) {
    if (s.delay > 0) { s.delay -= dt; continue; }
    s.s.position.y += s.sp * dt; s.s.position.x += Math.sin(clock * 0.5 + s.p) * dt * 0.3;
    s.s.material.opacity = Math.min(0.9, s.s.material.opacity + dt * 0.5) * (s.s.position.y > 70 ? 0.98 : 1);
    if (s.s.position.y > 95) { s.s.position.y = Math.max(0.5, height(s.s.position.x, s.s.position.z)) + 1; s.s.material.opacity = 0; }
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  dayP = (dayP + dt / CYCLE) % 1;
  applyCycle();
  if (started) updatePlayer(dt);
  else { cam.tYaw += dt * 0.05; }
  updateCamera(dt);
  updateWorld(dt);
  updateBreath(dt);
  plantCool -= dt;
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) toastEl.style.opacity = 0; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
camera.position.set(0, 14, 24);
camLook.set(P.x, P.y, P.z);
applyCycle(); updateHud();
requestAnimationFrame(frame);
// tiny debug hook (handy for testing in the console)
window.__isle = { P, lanterns, give: n => { motesHeld += n; updateHud(); }, time: p => { dayP = p; } };

document.getElementById('begin').addEventListener('click', () => {
  initAudio();
  started = true;
  const s = document.getElementById('start'); s.style.opacity = 0; s.style.pointerEvents = 'none';
  setTimeout(() => s.remove(), 2600);
  hud.style.opacity = 1; hints.style.opacity = 1;
  setTimeout(() => toast('gather motes of light and wake the seven lanterns', 6), 2500);
  setTimeout(() => { if (hintsOn) { hintsOn = false; hints.style.opacity = 0; } }, 40000);
});
</script>
</body>
